name: Web UI CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.changes.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/ci-web.yml'

  lint-and-build:
    needs: filter
    if: ${{ needs.filter.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'
      
      - name: Install Dependencies
        run: npm ci

      - name: Lint Check
        run: npm run lint

      - name: Run Web Tests & Coverage
        run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile=test-results/junit.xml

      - name: Upload Web Test & Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: |
            web/test-results/
            web/coverage/lcov.info
          if-no-files-found: ignore

      - name: Build Check
        run: npm run build

      - name: Run Impeccable UI Linter
        run: npx impeccable@4.1.0 detect .

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Web Docker Image
        run: docker build -t aegis-web:ci ./web
