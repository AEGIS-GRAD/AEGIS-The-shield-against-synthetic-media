name: Web UI CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'web/**'
      - '.github/workflows/ci-web.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'web/**'
      - '.github/workflows/ci-web.yml'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'
      
      - name: Install Dependencies
        run: npm install

      - name: Lint Check
        run: npm run lint
      
      - name: Build Check
        run: npm run build

      - name: Run Impeccable UI Linter
        run: npx impeccable@4.1.0 detect .

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Web Docker Image
        run: docker build -t aegis-web:ci ./web

