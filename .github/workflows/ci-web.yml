name: Web UI CI

on:
  pull_request:
    paths:
      - 'web/**'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'
      
      # TODO: Uncomment once the Web team initializes their Next.js project
      # - name: Install Dependencies
      #   run: npm install
      # 
      # - name: Build Check
      #   run: npm run build
      
      - name: Run Impeccable UI Linter
        run: npx impeccable@4.1.0 detect .
