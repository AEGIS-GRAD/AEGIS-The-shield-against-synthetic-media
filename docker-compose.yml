version: '3.8'

services:
  # ==========================================
  # SECURITY & INFRASTRUCTURE LAYER
  # ==========================================
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: aegis_mediamtx
    restart: always
    environment:
      - MTX_PROTOCOLS=tcp
    ports:
      - "8554:8554" # RTSP
      - "1935:1935" # RTMP
      - "8888:8888" # HLS
    networks:
      - aegis_net

  wazuh_agent:
    image: alpine
    command: tail -f /dev/null
    container_name: aegis_wazuh_agent
    volumes:
      - ./security:/app  # Automatically creates /security for custom Wazuh decoders/rules
    networks:
      - aegis_net

  api_gateway:
    image: nginx:alpine
    container_name: aegis_api_gateway
    ports:
      - "8081:80"
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    volumes:
      - ./security/gateway/nginx.conf.template:/etc/nginx/templates/default.conf.template
    networks:
      - aegis_net

  # ==========================================
  # LAYER A: ORCHESTRATION & WEB
  # ==========================================
  orchestrator:
    image: alpine
    command: tail -f /dev/null
    container_name: aegis_orchestrator
    ports:
      - "8000:8000"
    volumes:
      - ./orchestrator:/app  # Automatically creates /orchestrator
    networks:
      - aegis_net
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    depends_on:
      - mediamtx

  web:
    image: alpine
    command: tail -f /dev/null
    container_name: aegis_web
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app  # Automatically creates /web
    networks:
      - aegis_net
    depends_on:
      - orchestrator

  # ==========================================
  # LAYER B: INFERENCE ENGINE
  # ==========================================
  engine:
    image: alpine
    command: tail -f /dev/null
    container_name: aegis_engine
    volumes:
      - ./engine:/app  # Automatically creates /engine
    networks:
      - aegis_net
    depends_on:
      - orchestrator

  # ==========================================
  # LAYER C: MULTI-AGENT DEBATE (LLMs)
  # ==========================================
  debate:
    image: alpine
    command: tail -f /dev/null
    container_name: aegis_debate
    volumes:
      - ./debate:/app  # Automatically creates /debate
    networks:
      - aegis_net

  eval:
    image: alpine
    command: tail -f /dev/null
    container_name: aegis_eval
    volumes:
      - ./eval:/app  # Automatically creates /eval
    networks:
      - aegis_net

  mcp:
    image: alpine
    command: tail -f /dev/null
    container_name: aegis_mcp
    volumes:
      - ./mcp:/app  # Automatically creates /mcp
    networks:
      - aegis_net

  # ==========================================
  # DETECTOR MICROSERVICES (Stubs)
  # ==========================================
  detector_aasist:
    build:
      context: ./detectors/aasist
      dockerfile: Dockerfile
    container_name: aegis_detector_aasist
    # [DEVSECOPS EXCEPTION] Exposing port 8002 directly to the host bypasses the API Gateway 
    # (auth, rate-limiting, logging). This is kept for local AI team testing convenience. 
    # MUST BE REMOVED IN PRODUCTION to enforce routing through Nginx.
    ports:
      - "8002:8000"
    volumes:
      - ./detectors/aasist:/app
      - ./shared:/shared:ro
    networks:
      - aegis_net
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
      
  detector_rppg:
    image: python:3.10-slim
    command: tail -f /dev/null
    container_name: aegis_detector_rppg
    volumes:
      - ./detectors/rppg:/app
    networks:
      - aegis_net
    # TODO: Placeholder limit. AI team must profile rPPG on Jetson and adjust.
    deploy:
      resources:
        limits:
          memory: 2G
      
  detector_syncnet:
    image: python:3.10-slim
    command: tail -f /dev/null
    container_name: aegis_detector_syncnet
    volumes:
      - ./detectors/syncnet:/app
    networks:
      - aegis_net
    # TODO: Placeholder limit. AI team must profile SyncNet on Jetson and adjust.
    deploy:
      resources:
        limits:
          memory: 3G

  detector_dire:
    image: python:3.10-slim
    command: tail -f /dev/null
    container_name: aegis_detector_dire
    volumes:
      - ./detectors/dire:/app
    networks:
      - aegis_net
    # TODO: Placeholder limit. AI team must profile DIRE on Jetson and adjust.
    deploy:
      resources:
        limits:
          memory: 2G

  detector_binoculars:
    image: python:3.10-slim
    command: tail -f /dev/null
    container_name: aegis_detector_binoculars
    volumes:
      - ./detectors/binoculars:/app
    networks:
      - aegis_net
    # TODO: Placeholder limit. AI team must profile Binoculars on Jetson and adjust.
    deploy:
      resources:
        limits:
          memory: 4G

  detector_video_classifier:
    image: python:3.10-slim
    command: tail -f /dev/null
    container_name: aegis_detector_video_classifier
    volumes:
      - ./detectors/video_classifier:/app
    networks:
      - aegis_net
    # TODO: Placeholder limit. AI team must profile Video Classifier on Jetson and adjust.
    deploy:
      resources:
        limits:
          memory: 4G

networks:
  aegis_net:
    driver: bridge
