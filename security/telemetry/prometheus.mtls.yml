# Prometheus config for STRICT mode (docker-compose.mtls.yml).
# video-classifier and aasist now require client certificates, so they are scraped
# over https with the Prometheus mesh client certificate. Everything else is unchanged.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "aegis_detector_aasist"
    metrics_path: "/metrics"
    scheme: https
    tls_config:
      ca_file: /mesh/mesh_ca.crt
      cert_file: /mesh/mesh_prometheus.crt
      key_file: /mesh/mesh_prometheus.key
      server_name: aegis_detector_aasist
    static_configs:
      - targets: ["aegis_detector_aasist:8000"]

  - job_name: "aegis_detector_video_classifier"
    metrics_path: "/metrics"
    scheme: https
    tls_config:
      ca_file: /mesh/mesh_ca.crt
      cert_file: /mesh/mesh_prometheus.crt
      key_file: /mesh/mesh_prometheus.key
      server_name: aegis_detector_video_classifier
    static_configs:
      - targets: ["aegis_detector_video_classifier:8000"]

