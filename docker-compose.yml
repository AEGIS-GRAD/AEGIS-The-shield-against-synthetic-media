x-hardened-defaults: &hardened_defaults
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # ==========================================
  # SECURITY & INFRASTRUCTURE LAYER
  # ==========================================
  mediamtx:
    <<: *hardened_defaults
    image: bluenviron/mediamtx:1.21.4
    container_name: aegis_mediamtx
    restart: always
    environment:
      - MTX_PROTOCOLS=tcp
    ports:
      - "8554:8554" # RTSP
      - "1935:1935" # RTMP
      - "8888:8888" # HLS
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    networks:
      - aegis_net

  wazuh_agent:
    <<: *hardened_defaults
    image: alpine:3.23.8
    user: "65534:65534"
    command: tail -f /dev/null
    container_name: aegis_wazuh_agent
    volumes:
      - ./security:/app:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    networks:
      - aegis_net

  api_gateway:
    <<: *hardened_defaults
    image: nginx:1.31.8-alpine
    container_name: aegis_api_gateway
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    ports:
      - "8081:80"
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    volumes:
      - ./security/gateway/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,mode=1777
      - /var/run:rw,noexec,nosuid,size=8m,mode=1777
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=4m,mode=1777
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    networks:
      - aegis_net
    depends_on:
      - gateway_validator

  # Deep upload inspection (magic bytes, extension allowlist, path
  # confinement) that plain nginx config can't do. Internal-only - no
  # `ports:` mapping, reachable solely from api_gateway on aegis_net.
  gateway_validator:
    <<: *hardened_defaults
    build:
      context: ./security/gateway/validator
      dockerfile: Dockerfile
    container_name: aegis_gateway_validator
    volumes:
      - ./security/gateway/validator:/app:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    networks:
      - aegis_net
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  # ==========================================
  # LAYER A: ORCHESTRATION & WEB
  # ==========================================
  orchestrator:
    <<: *hardened_defaults
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: aegis_orchestrator
    ports:
      - "8000:8000"
    volumes:
      - ./orchestrator:/app:ro
      - ./capability_manifests:/capability_manifests:ro
      - ./debate:/repo/debate:ro # mounted as /repo/debate so `import debate` resolves with PYTHONPATH=/repo
      - ./security:/repo/security:ro
      - ./shared:/shared:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    networks:
      - aegis_net
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - AEGIS_DB_PATH=/tmp/flight_recorder.db
      - DETECTOR_VIDEO_CLASSIFIER_URL=http://detector_video_classifier:8000
      - DETECTOR_RPPG_URL=http://detector_rppg:8000
      - DETECTOR_AASIST_URL=http://detector_aasist:8000
      - DETECTOR_SYNCNET_URL=http://detector_syncnet:8000
      - DETECTOR_IMAGE_URL=http://detector_image:8000
      - DETECTOR_DETECTOR_IMAGE_URL=http://detector_image:8000
      - DETECTOR_DETECTOR_TEXT_URL=http://detector_text:8000
      - PYTHONPATH=/app/app:/repo # /repo/debate/__init__.py -> `import debate` resolves correctly
      - AEGIS_JUDGE_MODE=${AEGIS_JUDGE_MODE:-deterministic}
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s # extra time for debate package import on first boot
    depends_on:
      - mediamtx

  web:
    <<: *hardened_defaults
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: aegis_web
    ports:
      - "3000:3000"
    tmpfs:
      - /app/.next:rw,nosuid,size=256m,mode=1777
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - NEXT_PUBLIC_INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:8081
      - NEXT_PUBLIC_ORCHESTRATOR_URL=http://localhost:8000
      - NPM_CONFIG_CACHE=/tmp/.npm
    networks:
      - aegis_net
    depends_on:
      - orchestrator

  # ==========================================
  # LAYER B: INFERENCE ENGINE
  # ==========================================
  engine:
    <<: *hardened_defaults
    image: alpine:3.23.8
    user: "65534:65534"
    command: tail -f /dev/null
    container_name: aegis_engine
    volumes:
      - ./engine:/app:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    networks:
      - aegis_net
    depends_on:
      - orchestrator

  # ==========================================
  # LAYER C: MULTI-AGENT DEBATE (LLMs)
  # ==========================================
  debate:
    <<: *hardened_defaults
    image: alpine:3.23.8
    user: "65534:65534"
    command: tail -f /dev/null
    container_name: aegis_debate
    volumes:
      - ./debate:/app:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    networks:
      - aegis_net

  eval:
    <<: *hardened_defaults
    image: alpine:3.23.8
    user: "65534:65534"
    command: tail -f /dev/null
    container_name: aegis_eval
    volumes:
      - ./eval:/app:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    networks:
      - aegis_net

  mcp:
    <<: *hardened_defaults
    image: alpine:3.23.8
    user: "65534:65534"
    command: tail -f /dev/null
    container_name: aegis_mcp
    volumes:
      - ./mcp:/app:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    networks:
      - aegis_net

  # ==========================================
  # DETECTOR MICROSERVICES
  # ==========================================
  detector_aasist:
    <<: *hardened_defaults
    build:
      context: ./detectors/aasist
      dockerfile: Dockerfile
    container_name: aegis_detector_aasist
    # [DEVSECOPS EXCEPTION] Exposing port 8002 directly to the host bypasses the API Gateway
    # (auth, rate-limiting, logging). This is kept for local AI team testing convenience.
    # MUST BE REMOVED IN PRODUCTION to enforce routing through Nginx (see docker-compose.mtls.yml).
    ports:
      - "8002:8000"
    volumes:
      - ./detectors/aasist:/app:ro
      - ./shared:/shared:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    networks:
      - aegis_net
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - MODEL_WEIGHTS_PATH=/model_weights/AASIST.pth
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G

  detector_rppg:
    <<: *hardened_defaults
    build:
      context: ./detectors/rppg
      dockerfile: Dockerfile
    container_name: aegis_detector_rppg
    # [DEVSECOPS EXCEPTION] Host port kept for local AI team testing convenience; stripped in docker-compose.mtls.yml.
    ports:
      - "8003:8000"
    volumes:
      - ./detectors/rppg:/app:ro
      - ./shared:/shared:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    networks:
      - aegis_net
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

  detector_syncnet:
    <<: *hardened_defaults
    build:
      context: ./detectors/syncnet
      dockerfile: Dockerfile
    container_name: aegis_detector_syncnet
    ports:
      - "8004:8000"
    volumes:
      - ./detectors/syncnet:/app:ro
      - ./shared:/shared:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    networks:
      - aegis_net
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 3G

  detector_image:
    <<: *hardened_defaults
    build:
      context: ./detectors/image
      dockerfile: Dockerfile
    container_name: aegis_detector_image
    ports:
      - "8006:8000"
    volumes:
      - ./detectors/image:/app:ro
      - ./shared:/shared:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    networks:
      - aegis_net
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 4G

  detector_text:
    <<: *hardened_defaults
    build:
      context: ./detectors/text-detector
      dockerfile: Dockerfile
    container_name: aegis_detector_text
    ports:
      - "8005:8000"
    volumes:
      - ./detectors/text-detector:/app:ro
      - ./detectors/text-detector/models:/app/models:ro
      - ./shared:/shared:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    networks:
      - aegis_net
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - HF_HOME=/tmp/huggingface
      - AEGIS_TEXT_MODEL_DIR=/app/models/desklib-base
      - AEGIS_TEXT_PPL_MODEL_DIR=/app/models/gpt2
      - AEGIS_TEXT_USE_FINETUNED=${AEGIS_TEXT_USE_FINETUNED:-1}
      - AEGIS_TEXT_PRELOAD=1
      - AEGIS_TEXT_FP16=1
      - AEGIS_TEXT_ENABLE_PPL=1
      - AEGIS_TEXT_ENABLE_BINOCULARS=${AEGIS_TEXT_ENABLE_BINOCULARS:-0}
      - AEGIS_TEXT_LORA_DIR=${AEGIS_TEXT_LORA_DIR:-}
      - AEGIS_SHARED_VOLUME=/shared_volume
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8000/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    # Budgeted for 8 GB target GPU / container host (runs fp16 on RTX 3050 4 GB locally)
    deploy:
      resources:
        limits:
          memory: 8G

  detector_video_classifier:
    <<: *hardened_defaults
    build:
      context: ./detectors/video-classifier
      dockerfile: Dockerfile
    container_name: aegis_detector_video_classifier
    # Host port kept for local AI team testing convenience; stripped in docker-compose.mtls.yml.
    ports:
      - "8001:8000"
    volumes:
      - ./detectors/video-classifier:/app:ro
      - ./detectors/video-classifier/models:/app/models:ro
      - ./shared:/shared:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    networks:
      - aegis_net
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 4G

  # ==========================================
  # TELEMETRY & OBSERVABILITY (Dashboards as Code)
  # ==========================================
  prometheus:
    <<: *hardened_defaults
    image: prom/prometheus:v3.16.0
    container_name: aegis_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./security/telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    tmpfs:
      - /prometheus:rw,noexec,nosuid,size=256m,mode=1777
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    networks:
      - aegis_net

  grafana:
    <<: *hardened_defaults
    image: grafana/grafana:13.2.6
    container_name: aegis_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-change-grafana-admin-password}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-false}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/aegis_observability.json
    volumes:
      - ./security/telemetry/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./security/telemetry/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./security/telemetry/grafana/dashboards:/var/lib/grafana/dashboards:ro
    tmpfs:
      - /var/lib/grafana:rw,noexec,nosuid,size=128m,mode=1777
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    networks:
      - aegis_net
    depends_on:
      - prometheus

  # ==========================================
  # LIVE CAMERA SURVEILLANCE PIPELINE (docker compose --profile live up)
  # ==========================================
  ingestion:
    <<: *hardened_defaults
    build:
      context: .
      dockerfile: ./security/gateway/ingestion/Dockerfile
    container_name: aegis_ingestion
    profiles: [ live ]
    restart: unless-stopped
    ports:
      - "8443:8443" # mTLS Live Camera Ingestion
      - "8444:8444" # Live SSE Telemetry & Prometheus /metrics
    volumes:
      - ./security:/app/security:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    environment:
      - AEGIS_INGESTION_HOST=0.0.0.0
      - AEGIS_INGESTION_PORT=8443
      - AEGIS_TELEMETRY_HOST=0.0.0.0
      - AEGIS_TELEMETRY_PORT=8444
      - AEGIS_SECURITY_PROFILE=${AEGIS_SECURITY_PROFILE:-prod}
    networks:
      - aegis_net
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8444/telemetry/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  rtsp_camera_sim:
    <<: *hardened_defaults
    image: jrottenberg/ffmpeg:4.4-alpine
    user: "65534:65534"
    container_name: aegis_rtsp_camera_sim
    profiles: [ live ]
    restart: unless-stopped
    command: >
      -re -stream_loop -1 -i /media/authentic_feed.mp4 -c copy -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/live/camera1
    volumes:
      - ./web/public/sample_videos:/media:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    networks:
      - aegis_net
    depends_on:
      - mediamtx

  rtsp_bridge:
    <<: *hardened_defaults
    build:
      context: ./security/gateway/rtsp_bridge
      dockerfile: Dockerfile
    container_name: aegis_rtsp_bridge
    profiles: [ live ]
    restart: unless-stopped
    environment:
      - RTSP_URL=rtsp://mediamtx:8554/live/camera1
      - INGESTION_HOST=aegis_ingestion
      - INGESTION_PORT=8443
      - CERT_DIR=/certs
      - TARGET_FPS=10
    volumes:
      - ./security/transport/certs:/certs:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    networks:
      - aegis_net
    depends_on:
      - mediamtx
      - rtsp_camera_sim
      - ingestion

networks:
  aegis_net:
    driver: bridge
