# Prometheus scrape config for STRICT FULL-MESH mTLS mode (Week 10 Task 1).
# All detector targets require mutual TLS using the Prometheus mesh client certificate.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "aegis_detector_aasist"
    metrics_path: "/metrics"
    scheme: https
    tls_config:
      ca_file: /mesh/mesh_ca.crt
      cert_file: /mesh/mesh_prometheus.crt
      key_file: /mesh/mesh_prometheus.key
      server_name: aegis_detector_aasist
    static_configs:
      - targets: ["aegis_detector_aasist:8000"]

  - job_name: "aegis_detector_video_classifier"
    metrics_path: "/metrics"
    scheme: https
    tls_config:
      ca_file: /mesh/mesh_ca.crt
      cert_file: /mesh/mesh_prometheus.crt
      key_file: /mesh/mesh_prometheus.key
      server_name: aegis_detector_video_classifier
    static_configs:
      - targets: ["aegis_detector_video_classifier:8000"]

  - job_name: "aegis_detector_rppg"
    metrics_path: "/metrics"
    scheme: https
    tls_config:
      ca_file: /mesh/mesh_ca.crt
      cert_file: /mesh/mesh_prometheus.crt
      key_file: /mesh/mesh_prometheus.key
      server_name: aegis_detector_rppg
    static_configs:
      - targets: ["aegis_detector_rppg:8000"]

  - job_name: "aegis_detector_syncnet"
    metrics_path: "/metrics"
    scheme: https
    tls_config:
      ca_file: /mesh/mesh_ca.crt
      cert_file: /mesh/mesh_prometheus.crt
      key_file: /mesh/mesh_prometheus.key
      server_name: aegis_detector_syncnet
    static_configs:
      - targets: ["aegis_detector_syncnet:8000"]

