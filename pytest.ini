[pytest]
norecursedirs =
    venv
    orchestrator/venv
    web
    node_modules
    .git
    .next
    LocalDocs
    LocalFiles
    Community-Forensics
testpaths =
    live_pipeline
    orchestrator/tests
    debate/tests
    security/stream_integrity/tests
    security/fusion/tests
    security/gateway/validator/tests
    security/tests
    engine/tests
markers =
    slow: mark test as slow (model download or heavy video inference)
    gpu: mark test as requiring local GPU or downloaded LLM weights
